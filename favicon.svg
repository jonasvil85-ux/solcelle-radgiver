<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sun rays -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="2" x2="16" y2="5"/>
    <line x1="16" y1="27" x2="16" y2="30"/>
    <line x1="2" y1="16" x2="5" y2="16"/>
    <line x1="27" y1="16" x2="30" y2="16"/>
    <line x1="5.5" y1="5.5" x2="7.6" y2="7.6"/>
    <line x1="24.4" y1="24.4" x2="26.5" y2="26.5"/>
    <line x1="26.5" y1="5.5" x2="24.4" y2="7.6"/>
    <line x1="7.6" y1="24.4" x2="5.5" y2="26.5"/>
  </g>
  <!-- Solar panel -->
  <rect x="8" y="10" width="16" height="12" rx="1.5" fill="#1e3a5f"/>
  <!-- Panel grid lines -->
  <line x1="13.3" y1="10" x2="13.3" y2="22" stroke="#60a5fa" stroke-width="0.8"/>
  <line x1="18.7" y1="10" x2="18.7" y2="22" stroke="#60a5fa" stroke-width="0.8"/>
  <line x1="8" y1="15" x2="24" y2="15" stroke="#60a5fa" stroke-width="0.8"/>
  <!-- Sun glow -->
  <circle cx="16" cy="16" r="4" fill="#fbbf24" opacity="0.9"/>
</svg>
