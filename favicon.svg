<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f35"/>
      <stop offset="100%" stop-color="#0d2d1f"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Sun -->
  <circle cx="22" cy="9" r="3.5" fill="#F59E0B"/>
  <line x1="22" y1="4" x2="22" y2="5.2" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="26.8" y1="4.2" x2="25.9" y2="5.1" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="28" y1="9" x2="26.8" y2="9" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round"/>
  <!-- House silhouette -->
  <path d="M5 18 L16 9.5 L27 18" stroke="#10B981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M7.5 16.4 V27 H24.5 V16.4" fill="#0a2540" stroke="#10B981" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Solar panels on roof (left side = south-facing) -->
  <g opacity="0.95">
    <!-- Panel row 1 -->
    <rect x="8.2" y="17.5" width="4.5" height="2.8" rx="0.4" fill="#1e3a5f"/>
    <rect x="13.2" y="16.1" width="4.5" height="2.8" rx="0.4" fill="#1e3a5f"/>
    <!-- Panel row 2 -->
    <rect x="8.2" y="20.8" width="4.5" height="2.8" rx="0.4" fill="#1e3a5f"/>
    <rect x="13.2" y="19.4" width="4.5" height="2.8" rx="0.4" fill="#1e3a5f"/>
    <!-- Panel grid lines -->
    <line x1="10.4" y1="17.5" x2="10.4" y2="20.3" stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
    <line x1="8.2" y1="18.9" x2="12.7" y2="18.9" stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
    <line x1="15.4" y1="16.1" x2="15.4" y2="18.9" stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
    <line x1="13.2" y1="17.5" x2="17.7" y2="17.5" stroke="#60a5fa" stroke-width="0.5" opacity="0.7"/>
  </g>
  <!-- Emerald accent dot -->
  <circle cx="16" cy="31" r="1.2" fill="#10B981" opacity="0.6"/>
</svg>
